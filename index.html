<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FingerMTB — Mini Bikes · Big Tricks</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon-32x32.png">
  <meta property="og:title" content="FingerMTB – Mini Bikes">
  <meta property="og:description" content="Mini Bikes · Big Tricks – 3D-Printed Mini-MTBs & Files">
  <meta property="og:image" content="https://brickj-mtb.netlify.app/v10/V10side1.JPEG">
  <meta property="og:url" content="https://brickj-mtb.netlify.app/">
  <meta property="og:type" content="website">
  <meta name="google-site-verification" content="aNF-TgNQgJ67cJHaotOHZY3JBdhou-I6kVrIkcdjWww" />
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "70a7302f8a694fa897ff479afcb93500"}'></script>
</head>
<body>

  <header class="site-header">
    <div class="container flex-between">
      <div class="brand">
        <h1>FingerMTB</h1>
        <p class="tagline">Mini Bikes · Big Tricks</p>
      </div>
      <button class="menu-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav">
        <a href="index.html" class="active">Home</a>
        <a href="shop.html">Shop</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="#entryform">Contact</a>
      </nav>
      <div class="cart-container">
        <select id="currencySwitch">
          <option value="USD">$ USD</option>
          <option value="CHF">CHF</option>
          <option value="EUR">€ EUR</option>
        </select>
      </div>
    </div>
  </header>

  <!-- POPUP — wird per JS befüllt -->
  <div id="popup" class="popup-overlay" style="display:none">
    <div class="popup-box">
      <h2 id="popup-title"></h2>
      <p id="popup-subtitle"></p>
      <p id="popup-body"></p>
      <img id="popup-img" src="" alt="">
      <a id="popup-btn" class="btn2" href="#" target="_blank"></a>
      <button class="btn1" onclick="closePopup()" id="popup-dismiss"></button>
    </div>
  </div>

  <!-- HERO — wird per JS befüllt -->
  <section class="hero" id="hero-section">
    <div class="container hero-content">
      <p class="hero-badge" id="hero-badge"></p>
      <h2 id="hero-title"></h2>
      <p id="hero-subtitle"></p>
      <a id="hero-btn" class="btn-primary" href="shop.html"></a>
    </div>
  </section>

  <!-- FEATURED PRODUCTS -->
  <section class="product-section container">
    <h3>Our Products</h3>
    <div class="products-grid" id="featuredGrid"></div>
  </section>

  <!-- CONTACT -->
  <section id="entryform" class="hero is-primary is-bold">
    <div class="hero-body">
      <div class="container">
        <h1 class="title">Get in Touch</h1>
      </div>
    </div>
  </section>

  <form id="form" class="container m-4 pl-4">
    <div class="field">
      <label class="label">Name</label>
      <div class="control">
        <input class="input" type="text" placeholder="Instagram or TikTok handle" name="Client Name" />
      </div>
    </div>
    <div class="field">
      <label class="label">Message</label>
      <div class="control">
        <textarea class="textarea" placeholder="Project ideas, product reviews, questions…" name="Notes"></textarea>
      </div>
    </div>
    <div class="field is-grouped">
      <div class="control">
        <button class="button is-primary" type="submit" id="submit-button">Send Message</button>
      </div>
      <div class="control">
        <button class="button is-danger" type="button" onclick="document.getElementById('form').reset()">Cancel</button>
      </div>
    </div>
    <div id="message"></div>
  </form>

  <!-- FOOTER — wird per JS befüllt -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">FingerMTB</div>
      <div class="footer-links">
        <a href="privacy.html" id="footer-privacy"></a>
      </div>
      <div class="footer-copy">
        <p id="footer-line1"></p>
        <p id="footer-line2"></p>
      </div>
    </div>
  </footer>

  <div class="admin-entry" title="Admin"><a href="/dashboard-brickj.html">⚙</a></div>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    // ── Merge localStorage overrides with SITE_CONFIG ──
    function getCfg() {
      try {
        const stored = JSON.parse(localStorage.getItem('fm_cfg') || '{}');
        return deepMerge(SITE_CONFIG, stored.siteConfig || {});
      } catch { return SITE_CONFIG; }
    }

    function deepMerge(base, override) {
      const result = Object.assign({}, base);
      for (const key in override) {
        if (override[key] && typeof override[key] === 'object' && !Array.isArray(override[key])) {
          result[key] = deepMerge(base[key] || {}, override[key]);
        } else {
          result[key] = override[key];
        }
      }
      return result;
    }

    const cfg = getCfg();

    // ── Hero ──
    const heroTitle = document.getElementById('hero-title');
    if (heroTitle) heroTitle.innerHTML = cfg.hero.title.replace(/\n/g, '<br>');
    const heroSub = document.getElementById('hero-subtitle');
    if (heroSub) heroSub.textContent = cfg.hero.subtitle;
    const heroBtn = document.getElementById('hero-btn');
    if (heroBtn) { heroBtn.textContent = cfg.hero.buttonText; heroBtn.href = cfg.hero.buttonLink; }
    const heroBadge = document.getElementById('hero-badge');
    if (heroBadge) { heroBadge.textContent = cfg.hero.badge; heroBadge.style.display = cfg.hero.badge ? '' : 'none'; }

    // ── Footer ──
    const el = (id) => document.getElementById(id);
    if (el('footer-line1')) el('footer-line1').textContent = cfg.footer.line1;
    if (el('footer-line2')) el('footer-line2').textContent = cfg.footer.line2;
    if (el('footer-privacy')) el('footer-privacy').textContent = cfg.footer.privacyText;

    // ── Popup ──
    const page = 'index';
    const showPopup = cfg.popup.enabled && (cfg.popup.page === 'all' || cfg.popup.page === page);
    if (showPopup) {
      const popup = document.getElementById('popup');
      if (popup) {
        document.getElementById('popup-title').textContent    = cfg.popup.title;
        document.getElementById('popup-subtitle').textContent = cfg.popup.subtitle;
        document.getElementById('popup-body').textContent     = cfg.popup.body;
        const img = document.getElementById('popup-img');
        img.src = cfg.popup.image; img.style.display = cfg.popup.image ? '' : 'none';
        const btn = document.getElementById('popup-btn');
        btn.textContent = cfg.popup.buttonText; btn.href = cfg.popup.buttonLink;
        document.getElementById('popup-dismiss').textContent = cfg.popup.dismissText;
        setTimeout(() => popup.style.display = 'flex', cfg.popup.delay || 0);
      }
    }

    function closePopup() {
      const p = document.getElementById('popup');
      if (p) p.style.display = 'none';
    }

    // ── Featured Products ──
    const featuredIds = (typeof FEATURED_IDS !== 'undefined' && FEATURED_IDS.length)
      ? FEATURED_IDS : ['fingerski-starter-set','sender','v10','fingerski-v2-blue','kinkrail-blue'];

    const grid = document.getElementById('featuredGrid');
    if (grid && typeof PRODUCTS !== 'undefined') {
      // Sort: available first
      const sorted = [...featuredIds]
        .map(id => PRODUCTS.find(x => x.id === id))
        .filter(Boolean)
        .sort((a,b) => (a.status === 'available' ? -1 : 1) - (b.status === 'available' ? -1 : 1));

      sorted.forEach((p, i) => {
        const priceHTML = p.status === 'available'
          ? `<p class="price" data-usd="${p.priceUSD}" data-chf="${p.priceCHF}" data-eur="${p.priceEUR}">$${p.priceUSD.toFixed(2)}</p>`
          : `<p class="price-muted">${{soon:'Coming Soon','sold-out':'Sold Out'}[p.status]||''}</p>`;
        const card = document.createElement('div');
        card.className = 'product-card reveal';
        card.style.transitionDelay = `${i * 0.07}s`;
        card.innerHTML = `
          <img src="${p.images[0]}" alt="${p.name}" loading="lazy">
          <h4>${p.name}</h4>
          ${priceHTML}
          <a href="product.html?id=${p.id}" class="btn-secondary">View Details</a>`;
        grid.appendChild(card);
      });
    }

    // ── Scroll reveal ──
    const obs = new IntersectionObserver(entries =>
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }), { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    // ── Contact form ──
    const form = document.getElementById('form');
    const submitButton = document.getElementById('submit-button');
    const messageDiv = document.getElementById('message');

    form?.addEventListener('submit', async function(e) {
      e.preventDefault();
      messageDiv.textContent = 'Sending…'; messageDiv.style.display = 'block'; messageDiv.className = '';
      submitButton.disabled = true;
      try {
        const formDataObj = {};
        for (let [k,v] of new FormData(this).entries()) formDataObj[k] = v;
        const res = await fetch(
          'https://script.google.com/macros/s/AKfycby18XE62EImfZ8FJx_8yT0q-Q-nw-dV5hign-TeANThgP_Sa9xvrpfUoJhZBJIjUpExCQ/exec',
          { redirect:'follow', method:'POST', body: JSON.stringify(formDataObj), headers:{'Content-Type':'text/plain;charset=utf-8'} }
        );
        const data = await res.json();
        if (data.status === 'success') {
          messageDiv.textContent = data.message || 'Sent!'; messageDiv.className = 'success';
          form.reset();
        } else throw new Error(data.message || 'Failed');
      } catch(err) {
        messageDiv.textContent = 'Error: ' + err.message; messageDiv.className = 'error';
      } finally {
        submitButton.disabled = false;
        setTimeout(() => messageDiv.style.display = 'none', 4000);
      }
    });
  </script>
</body>
</html>
