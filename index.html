<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO: filled dynamically by JS from SITE_CONFIG -->
  <title id="meta-title">FingerMTB — Mini Bikes · Big Tricks</title>
  <meta name="description" id="meta-desc" content="3D-printed mini MTBs and finger skis from Switzerland. Handmade, for tricks and fun.">
  <meta name="keywords" id="meta-keywords" content="finger mtb, fingerski, mini bike, 3d print, switzerland">

  <!-- Open Graph -->
  <meta property="og:title" id="og-title" content="FingerMTB – Mini Bikes">
  <meta property="og:description" id="og-desc" content="Mini Bikes · Big Tricks – 3D-Printed Mini-MTBs">
  <meta property="og:image" id="og-image" content="https://brickj-mtb.netlify.app/v10/V10side1.JPEG">
  <meta property="og:url" content="https://brickj-mtb.netlify.app/">
  <meta property="og:type" content="website">

  <!-- Canonical -->
  <link rel="canonical" href="https://brickj-mtb.netlify.app/">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon-32x32.png">
  <meta name="google-site-verification" content="aNF-TgNQgJ67cJHaotOHZY3JBdhou-I6kVrIkcdjWww">
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "70a7302f8a694fa897ff479afcb93500"}'></script>
</head>
<body>

  <header class="site-header">
    <div class="container flex-between">
      <div class="brand">
        <h1>FingerMTB</h1>
        <p class="tagline">Mini Bikes · Big Tricks</p>
      </div>
      <button class="menu-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav">
        <a href="index.html" class="active">Home</a>
        <a href="shop.html">Shop</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="#entryform">Contact</a>
      </nav>
      <div class="cart-container">
        <select id="currencySwitch">
          <option value="USD">$ USD</option>
          <option value="CHF">CHF</option>
          <option value="EUR">€ EUR</option>
        </select>
      </div>
    </div>
  </header>

  <!-- POPUP — hidden until JS triggers it -->
  <div id="popup" class="popup-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="popup-box">
      <h2 id="popup-title"></h2>
      <p id="popup-subtitle"></p>
      <p id="popup-body"></p>
      <img id="popup-img" src="" alt="" style="display:none">
      <p id="popup-price" class="popup-price" style="display:none"></p>
      <a id="popup-btn" class="btn2" href="#" target="_blank" rel="noopener"></a>
      <button class="btn1" onclick="closePopup()" id="popup-dismiss"></button>
    </div>
  </div>

  <!-- HERO -->
  <section class="hero" id="hero-section">
    <div class="container hero-content">
      <p class="hero-badge" id="hero-badge" style="display:none"></p>
      <h2 id="hero-title">Ride Small.<br>Dream Big.</h2>
      <p id="hero-subtitle">Finger bikes &amp; skis, built for tricks and fun — all year round.</p>
      <a id="hero-btn" class="btn-primary" href="shop.html">Shop Now</a>
    </div>
  </section>

  <!-- FEATURED PRODUCTS -->
  <section class="product-section container">
    <h3>Our Products</h3>
    <div class="products-grid" id="featuredGrid"></div>
  </section>

  <!-- CONTACT -->
  <section id="entryform" class="hero is-primary is-bold">
    <div class="hero-body">
      <div class="container">
        <h1 class="title">Get in Touch</h1>
      </div>
    </div>
  </section>

  <form id="form" class="container m-4 pl-4">
    <div class="field">
      <label class="label">Name</label>
      <div class="control">
        <input class="input" type="text" placeholder="Instagram or TikTok handle" name="Client Name">
      </div>
    </div>
    <div class="field">
      <label class="label">Message</label>
      <div class="control">
        <textarea class="textarea" placeholder="Project ideas, product reviews, questions…" name="Notes"></textarea>
      </div>
    </div>
    <div class="field is-grouped">
      <div class="control">
        <button class="button is-primary" type="submit" id="submit-button">Send Message</button>
      </div>
      <div class="control">
        <button class="button is-danger" type="button" onclick="document.getElementById('form').reset()">Cancel</button>
      </div>
    </div>
    <div id="message"></div>
  </form>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">FingerMTB</div>
      <div class="footer-links">
        <a href="privacy.html" id="footer-privacy">Privacy Policy</a>
      </div>
      <div class="footer-copy">
        <p id="footer-line1">BrickJ_mtb · Handmade in Switzerland 🇨🇭</p>
        <p id="footer-line2">No cookies 🍪</p>
      </div>
    </div>
  </footer>

  <div class="admin-entry" title="Admin"><a href="/dashboard-brickj.html">⚙</a></div>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    // ── Config helpers ──────────────────────────────────
    function deepMerge(base, over) {
      const r = {...base};
      for (const k in over) {
        if (over[k] && typeof over[k]==='object' && !Array.isArray(over[k]))
          r[k] = deepMerge(base[k]||{}, over[k]);
        else r[k] = over[k];
      }
      return r;
    }

    function getCfg() {
      try {
        const stored = JSON.parse(localStorage.getItem('fm_cfg') || '{}');
        return deepMerge(
          typeof SITE_CONFIG !== 'undefined' ? SITE_CONFIG : {},
          stored.siteConfig || {}
        );
      } catch { return typeof SITE_CONFIG !== 'undefined' ? SITE_CONFIG : {}; }
    }

    function getFeaturedIds() {
      try {
        const stored = JSON.parse(localStorage.getItem('fm_cfg') || '{}');
        if (stored.featuredIds?.length) return stored.featuredIds;
      } catch {}
      return typeof FEATURED_IDS !== 'undefined' ? FEATURED_IDS : [];
    }

    const cfg = getCfg();

    // ── SEO meta tags ───────────────────────────────────
    if (cfg.seo?.title) {
      document.getElementById('meta-title').textContent = cfg.seo.title;
      document.getElementById('og-title').content = cfg.seo.title;
    }
    if (cfg.seo?.description) {
      document.getElementById('meta-desc').content = cfg.seo.description;
      document.getElementById('og-desc').content = cfg.seo.description;
    }
    if (cfg.seo?.ogImage) document.getElementById('og-image').content = cfg.seo.ogImage;
    if (cfg.seo?.keywords) document.getElementById('meta-keywords').content = cfg.seo.keywords;

    // ── Hero ────────────────────────────────────────────
    if (cfg.hero?.title) document.getElementById('hero-title').innerHTML = cfg.hero.title.replace(/\n/g,'<br>');
    if (cfg.hero?.subtitle) document.getElementById('hero-subtitle').textContent = cfg.hero.subtitle;
    if (cfg.hero?.buttonText) document.getElementById('hero-btn').textContent = cfg.hero.buttonText;
    if (cfg.hero?.buttonLink) document.getElementById('hero-btn').href = cfg.hero.buttonLink;
    const badgeEl = document.getElementById('hero-badge');
    if (cfg.hero?.badge) { badgeEl.textContent = cfg.hero.badge; badgeEl.style.display = ''; }

    // ── Footer ──────────────────────────────────────────
    if (cfg.footer?.line1) document.getElementById('footer-line1').textContent = cfg.footer.line1;
    if (cfg.footer?.line2) document.getElementById('footer-line2').textContent = cfg.footer.line2;
    if (cfg.footer?.privacyText) document.getElementById('footer-privacy').textContent = cfg.footer.privacyText;

    // ── Popup ───────────────────────────────────────────
    // Only trigger via setTimeout — no immediate show
    const showPopup = cfg.popup?.enabled !== false &&
      (cfg.popup?.page === 'all' || cfg.popup?.page === 'index' || !cfg.popup?.page);

    if (showPopup) {
      const popupEl = document.getElementById('popup');
      document.getElementById('popup-title').textContent = cfg.popup.title || '';
      document.getElementById('popup-subtitle').textContent = cfg.popup.subtitle || '';
      document.getElementById('popup-body').textContent = cfg.popup.body || '';

      const imgEl = document.getElementById('popup-img');
      if (cfg.popup.image) { imgEl.src = cfg.popup.image; imgEl.style.display = ''; }

      const priceEl = document.getElementById('popup-price');
      if (cfg.popup.price) { priceEl.textContent = cfg.popup.price; priceEl.style.display = ''; }

      const btnEl = document.getElementById('popup-btn');
      btnEl.textContent = cfg.popup.buttonText || 'Buy Now';
      btnEl.href = cfg.popup.buttonLink || '#';

      document.getElementById('popup-dismiss').textContent = cfg.popup.dismissText || 'Close';

      // FIXED: only ONE setTimeout, popup starts hidden
      const delay = parseInt(cfg.popup.delay) || 0;
      setTimeout(() => { popupEl.style.display = 'flex'; }, delay);
    }

    // ── Featured Products ────────────────────────────────
    const featuredIds = getFeaturedIds();
    const grid = document.getElementById('featuredGrid');

    if (grid && typeof PRODUCTS !== 'undefined' && featuredIds.length) {
      // Available products first
      const sorted = featuredIds
        .map(id => PRODUCTS.find(p => p.id === id))
        .filter(Boolean)
        .sort((a, b) => (a.status === 'available' ? 0 : 1) - (b.status === 'available' ? 0 : 1));

      sorted.forEach((p, i) => {
        const priceHTML = p.status === 'available'
          ? `<p class="price" data-usd="${p.priceUSD}" data-chf="${p.priceCHF}" data-eur="${p.priceEUR}">$${p.priceUSD.toFixed(2)}</p>`
          : `<p class="price-muted">${{soon:'Coming Soon','sold-out':'Sold Out'}[p.status]||''}</p>`;
        const card = document.createElement('div');
        card.className = 'product-card reveal';
        card.style.transitionDelay = `${i * 0.07}s`;
        card.innerHTML = `
          <img src="${p.images[0]}" alt="${p.name}" loading="lazy">
          <h4>${p.name}</h4>
          ${priceHTML}
          <a href="product.html?id=${p.id}" class="btn-secondary">View Details</a>`;
        grid.appendChild(card);
      });
    }

    // ── Scroll reveal ────────────────────────────────────
    const observer = new IntersectionObserver(entries =>
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
      { threshold: 0.1 }
    );
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // ── Contact form ─────────────────────────────────────
    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submit-button');
    const msgDiv = document.getElementById('message');

    form?.addEventListener('submit', async e => {
      e.preventDefault();
      msgDiv.textContent = 'Sending…'; msgDiv.style.display = 'block'; msgDiv.className = '';
      submitBtn.disabled = true;
      try {
        const obj = {};
        for (const [k,v] of new FormData(form).entries()) obj[k] = v;
        const res = await fetch(
          'https://script.google.com/macros/s/AKfycby18XE62EImfZ8FJx_8yT0q-Q-nw-dV5hign-TeANThgP_Sa9xvrpfUoJhZBJIjUpExCQ/exec',
          { redirect:'follow', method:'POST', body:JSON.stringify(obj), headers:{'Content-Type':'text/plain;charset=utf-8'} }
        );
        const data = await res.json();
        if (data.status==='success') {
          msgDiv.textContent = data.message||'Sent!'; msgDiv.className = 'success'; form.reset();
        } else throw new Error(data.message||'Failed');
      } catch(err) {
        msgDiv.textContent = 'Error: '+err.message; msgDiv.className = 'error';
      } finally {
        submitBtn.disabled = false;
        setTimeout(() => msgDiv.style.display = 'none', 4000);
      }
    });
  </script>
</body>
</html>
