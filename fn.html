<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple 3D Shooter (Three.js)</title>
  <style>
    html,body{height:100%;margin:0;background:#111;color:#eee;font-family:system-ui,Segoe UI,Roboto,Arial}
    #overlay{position:fixed;left:10px;top:10px;z-index:10}
    #hud{position:fixed;right:10px;top:10px;z-index:10;text-align:right}
    #info{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:rgba(0,0,0,0.5);padding:8px 12px;border-radius:6px}
    canvas{display:block}
    button{padding:.5rem 1rem;border-radius:6px;border:0;background:#007bff;color:white}
  </style>
</head>
<body>
  <div id="overlay">
    <div style="margin-bottom:8px">Controls: <strong>W A S D</strong> = Move · <strong>Mouse</strong> = Look · <strong>Click</strong> = Shoot</div>
    <button id="startBtn">Start / Lock Pointer</button>
  </div>
  <div id="hud">
    <div>HP: <span id="hp">100</span></div>
    <div>Score: <span id="score">0</span></div>
    <div>Enemies: <span id="enemies">0</span></div>
  </div>
  <div id="info">Aim at enemies and shoot them. Reload page to restart.</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.155.0/build/three.module.js';
import { PointerLockControls } from 'https://unpkg.com/three@0.155.0/examples/jsm/controls/PointerLockControls.js';

// Basic scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
hemi.position.set(0,50,0); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 0.6); dir.position.set(-10,20,10); scene.add(dir);

// Ground
const groundGeo = new THREE.PlaneGeometry(200,200);
const groundMat = new THREE.MeshPhongMaterial({color:0x556b2f});
const ground = new THREE.Mesh(groundGeo, groundMat); ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// Player starting position
camera.position.set(0,1.6,0);

// Controls
const controls = new PointerLockControls(camera, document.body);
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('click', ()=> controls.lock());
controls.addEventListener('lock', ()=> startBtn.style.display='none');
controls.addEventListener('unlock', ()=> startBtn.style.display='inline-block');
scene.add(controls.getObject());

// Movement
const move = {forward:false,back:false,left:false,right:false};
let canJump = true;
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
const speed = 6.0;

document.addEventListener('keydown', (e)=>{
  if(e.code==='KeyW') move.forward=true;
  if(e.code==='KeyS') move.back=true;
  if(e.code==='KeyA') move.left=true;
  if(e.code==='KeyD') move.right=true;
});
document.addEventListener('keyup', (e)=>{
  if(e.code==='KeyW') move.forward=false;
  if(e.code==='KeyS') move.back=false;
  if(e.code==='KeyA') move.left=false;
  if(e.code==='KeyD') move.right=false;
});

// Simple crosshair
const cross = document.createElement('div');
cross.style.position='fixed'; cross.style.left='50%'; cross.style.top='50%'; cross.style.width='2px'; cross.style.height='2px'; cross.style.background='white'; cross.style.zIndex='20'; cross.style.transform='translate(-50%,-50%)';
document.body.appendChild(cross);

// Bullets management
const bullets = [];
const bulletSpeed = 50;

function shoot(){
  const bulletGeo = new THREE.SphereGeometry(0.05,6,6);
  const bulletMat = new THREE.MeshBasicMaterial({color:0xffff00});
  const bullet = new THREE.Mesh(bulletGeo, bulletMat);
  bullet.position.copy(camera.position);
  // direction vector from camera
  const forward = new THREE.Vector3(); camera.getWorldDirection(forward);
  bullet.userData.velocity = forward.multiplyScalar(bulletSpeed);
  scene.add(bullet);
  bullets.push(bullet);
}

document.addEventListener('pointerdown', (e)=>{
  if(controls.isLocked) shoot();
});

// Enemies
const enemies = [];
let spawnTimer = 0;
let spawnInterval = 2.0; // seconds
let enemyCount = 0;

function spawnEnemy(){
  const geo = new THREE.SphereGeometry(0.5,12,12);
  const mat = new THREE.MeshPhongMaterial({color:0xff4444});
  const e = new THREE.Mesh(geo, mat);
  // spawn at edge
  const angle = Math.random()*Math.PI*2;
  const radius = 30 + Math.random()*20;
  e.position.set(Math.cos(angle)*radius, 0.5, Math.sin(angle)*radius);
  e.userData.hp = 3;
  e.userData.speed = 1 + Math.random()*1.5;
  scene.add(e);
  enemies.push(e);
  enemyCount++; updateHUD();
}

// HUD
const hpEl = document.getElementById('hp');
const scoreEl = document.getElementById('score');
const enemiesEl = document.getElementById('enemies');
let playerHP = 100; let score = 0;
function updateHUD(){ hpEl.textContent = Math.max(0,Math.floor(playerHP)); scoreEl.textContent = score; enemiesEl.textContent = enemyCount; }
updateHUD();

// Simple enemy AI: move toward player and damage on collision
function updateEnemies(dt){
  const playerPos = controls.getObject().position;
  for(let i=enemies.length-1;i>=0;i--){
    const en = enemies[i];
    const toPlayer = new THREE.Vector3().subVectors(playerPos, en.position);
    const dist = toPlayer.length();
    toPlayer.normalize();
    en.position.addScaledVector(toPlayer, en.userData.speed * dt);
    // simple look at
    en.lookAt(playerPos.x, en.position.y, playerPos.z);
    // collision with player
    if(dist < 1.2){
      // damage player
      playerHP -= 10 * dt; // per second while touching
      if(playerHP <= 0){ playerHP = 0; controls.unlock(); }
    }
  }
}

// Collision bullet-enemy
function checkBullets(dt){
  for(let b=bullets.length-1;b>=0;b--){
    const bullet = bullets[b];
    bullet.position.addScaledVector(bullet.userData.velocity, dt);
    // remove if far
    if(bullet.position.length() > 200){ scene.remove(bullet); bullets.splice(b,1); continue; }
    // check against enemies
    for(let i=enemies.length-1;i>=0;i--){
      const en = enemies[i];
      const d = en.position.distanceTo(bullet.position);
      if(d < 0.6){
        en.userData.hp -= 1;
        scene.remove(bullet);
        bullets.splice(b,1);
        if(en.userData.hp <= 0){
          scene.remove(en);
          enemies.splice(i,1);
          enemyCount--; score += 10; updateHUD();
        }
        break;
      }
    }
  }
}

// Basic environment objects
for(let i=0;i<100;i++){
  const box = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshPhongMaterial({color:0x8b4513}));
  box.position.set((Math.random()-0.5)*120,0.5,(Math.random()-0.5)*120);
  scene.add(box);
}

// Resize
window.addEventListener('resize', ()=>{camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);});

// Timing
let prevTime = performance.now()/1000;

function animate(){
  const time = performance.now()/1000;
  const dt = Math.min(0.05, time - prevTime);
  prevTime = time;

  // movement
  if(controls.isLocked){
    velocity.x -= velocity.x * 10.0 * dt;
    velocity.z -= velocity.z * 10.0 * dt;

    direction.z = Number(move.forward) - Number(move.back);
    direction.x = Number(move.right) - Number(move.left);
    direction.normalize();

    if(move.forward || move.back) velocity.z -= direction.z * speed * dt;
    if(move.left || move.right) velocity.x -= direction.x * speed * dt;

    controls.moveRight(-velocity.x * dt);
    controls.moveForward(-velocity.z * dt);
  }

  // spawn enemies periodically
  spawnTimer += dt;
  if(spawnTimer >= spawnInterval){ spawnTimer = 0; spawnEnemy(); if(spawnInterval>0.6) spawnInterval *= 0.98; }

  updateEnemies(dt);
  checkBullets(dt);

  updateHUD();

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate();

// Simple instructions in console
console.log('3D Shooter ready. Click "Start / Lock Pointer" then use WASD and mouse.');

</script>
</body>
</html>
