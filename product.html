          <option value="USD">$ USD</option>

      </div>

  <main id="productMain"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">FingerMTB</div>
      <div class="footer-center">
        <div class="social-links" id="footer-social" style="display:none">
          <a id="footer-instagram" href="#" target="_blank" rel="noopener" style="display:none" aria-label="Instagram">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </a>
          <a id="footer-tiktok" href="#" target="_blank" rel="noopener" style="display:none" aria-label="TikTok">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.76a4.85 4.85 0 01-1.01-.07z"/></svg>

    </div>
  </footer>

  <div class="admin-entry" title="Admin"><a href="/dashboard-brickj.html">⚙</a></div>

  
  <!-- Zoom overlay -->
  <div id="zoomOverlay" onclick="closeZoom()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;align-items:center;justify-content:center;cursor:zoom-out;padding:20px">
    <img id="zoomImg" src="" style="max-width:100%;max-height:90vh;object-fit:contain;border-radius:8px;user-select:none" onclick="event.stopPropagation()">
    <button onclick="closeZoom()" style="position:absolute;top:16px;right:20px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:1.5rem;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>
  </div>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    function deepMerge(base, over) {
      const r={...base};
      for(const k in over){
        if(over[k]&&typeof over[k]==='object'&&!Array.isArray(over[k])) r[k]=deepMerge(base[k]||{},over[k]);
        else r[k]=over[k];
      }
      return r;
    }
    function getCfg() {
      try {
        const s=JSON.parse(localStorage.getItem('fm_cfg')||'{}');
        return deepMerge(typeof SITE_CONFIG!=='undefined'?SITE_CONFIG:{},s.siteConfig||{});
      } catch { return typeof SITE_CONFIG!=='undefined'?SITE_CONFIG:{}; }
    }
    const cfg = getCfg();

    // Auto-set CHF for Swiss visitors
    (function() {
      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const lang = navigator.language || '';
        if (tz.includes('Zurich') || tz.includes('Europe/Zurich') || lang.startsWith('de-CH') || lang.startsWith('fr-CH')) {
          const sel = document.getElementById('currencySwitch');
          if (sel) sel.value = 'CHF';
          // Store preference
          localStorage.setItem('fm_currency', 'CHF');
        } else {
          const saved = localStorage.getItem('fm_currency');
          if (saved) { const sel = document.getElementById('currencySwitch'); if (sel) sel.value = saved; }
        }
      } catch(e) {}
    })();

    // Footer
    if(cfg.footer?.line1) document.getElementById('footer-line1').textContent=cfg.footer.line1;
    if(cfg.footer?.line2) document.getElementById('footer-line2').textContent=cfg.footer.line2;

    // Social links
    function setSocialLink(prefix, platform, url) {
      const el=document.getElementById(`${prefix}-${platform}`);
      if(el&&url){el.href=url;el.style.display='inline-flex';}
    }
    if(cfg.social?.enabled!==false&&(cfg.social?.instagram||cfg.social?.tiktok)){
      const pos=cfg.social?.position||'both';
      if(pos==='header'||pos==='both'){
        document.getElementById('header-social').style.display='flex';
        setSocialLink('header','instagram',cfg.social.instagram);
        setSocialLink('header','tiktok',cfg.social.tiktok);
      }
      if(pos==='footer'||pos==='both'){
        document.getElementById('footer-social').style.display='flex';
        setSocialLink('footer','instagram',cfg.social.instagram);
        setSocialLink('footer','tiktok',cfg.social.tiktok);
      }
    }

    // ── PRODUCT RENDER ──────────────────────────────
    (function() {
      const params  = new URLSearchParams(location.search);
      let id        = params.get('id');
      const main    = document.getElementById('productMain');

      function showNotFound() {
        document.title = '404 — FingerMTB';
        // Pick 3 random available products to suggest
        const suggestions = (typeof PRODUCTS !== 'undefined')
          ? PRODUCTS.filter(p=>p.status==='available').sort(()=>Math.random()-.5).slice(0,3)
          : [];
        const suggHTML = suggestions.length ? `
          <div style="margin-top:40px;text-align:left;max-width:600px;margin-left:auto;margin-right:auto">
            <p style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.1em;color:var(--muted);margin-bottom:14px">MAYBE YOU WERE LOOKING FOR</p>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
              ${suggestions.map(p=>`
                <a href="product.html?id=${p.id}" style="background:var(--surface);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--text);transition:transform .2s" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform=''">
                  <img src="${p.images?.[0]||'COMING SOON.png'}" style="width:100%;aspect-ratio:1;object-fit:cover">
                  <div style="padding:10px 12px">
                    <div style="font-size:.8rem;font-weight:600;margin-bottom:3px">${p.name}</div>
                    <div style="font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:var(--accent2)">CHF ${parseFloat(p.priceCHF||0).toFixed(2)}</div>
                  </div>
                </a>`).join('')}
            </div>
          </div>` : '';
        main.innerHTML = `
          <div style="text-align:center;padding:80px 24px 40px">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:8rem;color:var(--border);line-height:1;margin-bottom:8px">404</div>
            <h2 style="font-family:'Bebas Neue',sans-serif;font-size:2rem;margin-bottom:12px">Product not found</h2>
            <p style="color:var(--muted);margin-bottom:28px;max-width:380px;margin-left:auto;margin-right:auto;line-height:1.6">
              This product doesn't exist or may have been removed. Check out the shop for what's available.
            </p>
            <a href="shop.html" class="buy-btn" style="display:inline-flex">
              <span>Browse the Shop</span>
              <span class="buy-btn-arrow">→</span>
            </a>
            ${suggHTML}
          </div>`;
      }

      if (!id) { showNotFound(); return; }
      if (typeof LEGACY_MAP !== 'undefined' && LEGACY_MAP[id]) id = LEGACY_MAP[id];
      const product = PRODUCTS.find(p => p.id === id);
      if (!product) { showNotFound(); return; }

      document.title = `${product.name} · FingerMTB`;

      const badgeClass = {available:'status-available','sold-out':'status-sold-out',soon:'status-soon'}[product.status] || '';
      const badgeLabel = {available:'In Stock','sold-out':'Sold Out',soon:'Coming Soon'}[product.status] || '';

      // Auto meta description per product
      const autoDesc = `${product.name} — ${product.description?.substring(0,120)||'Handmade 3D-printed mini bike from Switzerland.'} | FingerMTB`;
      document.getElementById('meta-desc').content = autoDesc;
      document.getElementById('og-desc').content  = autoDesc;
      document.getElementById('og-title').content = `${product.name} · FingerMTB`;
      if (product.images?.[0]) document.getElementById('og-image').content = product.images[0].startsWith('http') ? product.images[0] : `https://brickj-mtb.netlify.app/${product.images[0]}`;

      // Low stock badge
      const stock = parseInt(product.stock)||0;
      const lowStockHTML = (product.status==='available' && stock > 0 && stock <= 3)
        ? `<span class="low-stock-badge">🔥 Only ${stock} left!</span>` : '';

      // Image slides
      const slides = (product.images||['COMING SOON.png']).map((src,i) => {
        // tiny 1x1 grey placeholder encoded inline — swapped out on load
        const placeholder = 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 400 400\'%3E%3Crect width=\'400\' height=\'400\' fill=\'%23161818\'/%3E%3C/svg%3E';
        return `<img
          src="${i===0?src:placeholder}"
          data-src="${src}"
          alt="${product.name}"
          class="slide${i===0?' active':''} img-blur"
          loading="${i===0?'eager':'lazy'}"
          onload="this.classList.add('img-loaded')"
          onerror="this.src='COMING SOON.png';this.classList.add('img-loaded')">`;
      }).join('');

      // Specs
      const specItems = product.specs?.length
        ? `<ul>${product.specs.map(s=>`<li>${s}</li>`).join('')}</ul>` : '';

      // Note
      const noteHTML = product.note
        ? `<div class="product-note">ℹ️ ${product.note}</div>` : '';

      // Trust badges
      const trustBadge = cfg.trust?.badge
        ? `<span class="trust-badge">${cfg.trust.badge}</span>` : '';
      const shipBadge = cfg.trust?.shipping
        ? `<span class="trust-badge trust-badge--shipping">🚚 ${cfg.trust.shipping}</span>` : '';

      // Variants
      let variantsHTML = '';
      if (product.variants?.length) {
        const chips = product.variants.map((v,i) => {
          const effectiveStatus = v.status || product.status;
          const isSoldOut = effectiveStatus === 'sold-out';
          const dot = v.color
            ? `<span style="width:13px;height:13px;border-radius:50%;background:${v.color};flex-shrink:0;border:1.5px solid rgba(255,255,255,.2);display:inline-block"></span>`
            : '';
          return `<button
            class="variant-chip${isSoldOut?' variant-chip--soldout':''}"
            data-link="${v.link||product.etsyLink||''}"
            data-pricechf="${v.priceCHF||product.priceCHF||0}"
            data-priceusd="${product.priceUSD||0}"
            data-priceeur="${product.priceEUR||0}"
            data-status="${effectiveStatus}"
            onclick="selectVariant(this)"
            ${isSoldOut?'disabled':''}>
            ${dot}<span>${v.label}</span>
            ${isSoldOut?'<span style="font-size:.6rem;opacity:.5">(sold out)</span>':''}
          </button>`;
        }).join('');
        variantsHTML = `
          <div class="variants-section anim-hero" style="animation-delay:.2s">
            <div class="variants-label">Choose option</div>
            <div class="variants-chips">${chips}</div>
          </div>`;
      }

      // Buy section
      let buySection = '';
      if (product.variants?.length) {
        buySection = `
          <a class="buy-btn buy-btn--disabled" id="variantBuyBtn" href="#" target="_blank" rel="noopener">
            <span class="buy-btn-icon">🛒</span>
            <span id="variantBuyLabel">Select an option above</span>
            <span class="buy-btn-arrow">→</span>
          </a>`;
      } else if (product.status==='available' && product.etsyLink) {
        buySection = `
          <a class="buy-btn" href="${product.etsyLink}" target="_blank" rel="noopener">
            <span class="buy-btn-icon">🛒</span>
            <span>${product.etsyLabel||'Buy Now'}</span>
            <span class="buy-btn-arrow">→</span>
          </a>`;
      } else {
        buySection = `<div class="buy-btn buy-btn--disabled">${badgeLabel||'Unavailable'}</div>`;
      }

      // Size reference
      const sizeHTML = (cfg.sizeref?.enabled!==false && cfg.sizeref?.title) ? `
        <div class="size-reference">
          ${cfg.sizeref.image?`<img src="${cfg.sizeref.image}" alt="Size reference" class="size-ref-img">`:''}
          <div class="size-ref-text">
            <span class="size-ref-icon">📏</span>
            <div>
              <strong>${cfg.sizeref.title}</strong>
              ${cfg.sizeref.text?`<p>${cfg.sizeref.text}</p>`:''}
            </div>
          </div>
        </div>` : '';

      // Media section
      let mediaHTML = '';
      if (product.media?.length) {
        const cards = product.media.map((m,i) => {
          let inner = '';
          if (m.type==='youtube') {
            const ytId = m.url.match(/(?:v=|youtu\.be\/)([^&\?]+)/)?.[1] || m.url;
            inner = `<div class="media-youtube"><iframe src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"></iframe></div>`;
          } else if (m.type==='video') {
            inner = `<video src="${m.url}" controls playsinline loop muted class="media-video"></video>`;
          } else if (m.type==='gif') {
            inner = `<img src="${m.url}" alt="${m.caption||'Animation'}" class="media-gif" loading="lazy">`;
          }
          return `<div class="media-card" style="--delay:${i*0.1}s">${inner}${m.caption?`<p class="media-caption">${m.caption}</p>`:''}</div>`;
        }).join('');
        mediaHTML = `<div class="media-section"><h3 class="media-section-title">In Action</h3><div class="media-grid">${cards}</div></div>`;
      }

      // Render
      main.innerHTML = `
        <section class="product-hero">
          <div class="productimgbox">
            <div class="slider">
              <button class="prev" aria-label="Previous">‹</button>
              <div class="slides" id="mainSlides">${slides}</div>
              <button class="next" aria-label="Next">›</button>
            </div>
            <div class="zoom-hint">🔍 Tap image to zoom</div>
          </div>
          <div class="pricedescription">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span class="status-badge ${badgeClass}">${badgeLabel}</span>
              ${lowStockHTML}
            </div>
            <h2 class="product-name-heading">${product.name}</h2>
            <p class="price anim-hero" data-usd="${product.priceUSD}" data-chf="${product.priceCHF}" data-eur="${product.priceEUR}" style="animation-delay:.1s">
              $${(product.priceUSD||0).toFixed(2)}
            </p>
            <p class="product-description anim-hero" style="animation-delay:.18s">${product.description}</p>
            ${variantsHTML}
            <div class="anim-hero" style="animation-delay:.28s">
              ${buySection}
              <div class="share-row">
                <button class="share-btn" onclick="shareProduct('${product.name}','${product.id}')" title="Share this product">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                  Share
                </button>
                <button class="share-btn share-btn--wa" onclick="shareWhatsApp('${product.name}','${product.id}')" title="Share on WhatsApp">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                  WhatsApp
                </button>
              </div>
            </div>
            <div class="trust-badges anim-hero" style="animation-delay:.36s">${trustBadge}${shipBadge}</div>
            <div class="share-row anim-hero" style="animation-delay:.42s">
              <span class="share-label">Share</span>
              <button class="share-btn share-btn--copy" onclick="shareProduct('copy','${product.name}')" title="Copy link">🔗</button>
              <button class="share-btn share-btn--wa" onclick="shareProduct('whatsapp','${product.name}')" title="WhatsApp">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              </button>
              <button class="share-btn share-btn--ig" onclick="shareProduct('instagram','${product.name}')" title="Instagram (copy link)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
              </button>
            </div>
            ${sizeHTML?`<div class="anim-hero" style="animation-delay:.42s">${sizeHTML}</div>`:''}
            ${specItems?`<div class="details anim-hero" style="animation-delay:.48s"><h3>Specs</h3>${specItems}</div>`:''}
            ${noteHTML?`<div class="anim-hero" style="animation-delay:.54s">${noteHTML}</div>`:''}
          </div>
        </section>
        ${mediaHTML}
        <div id="relatedSection"></div>`;

      // Media card observer
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if(e.isIntersecting){e.target.classList.add('in-view');obs.unobserve(e.target);} });
      }, {threshold:0.1});
      main.querySelectorAll('.media-card').forEach(el => obs.observe(el));

      // Image zoom
      main.querySelectorAll('.slide.img-blur, .slide').forEach(img => {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', () => {
          const overlay = document.getElementById('zoomOverlay');
          const zoomImg = document.getElementById('zoomImg');
          zoomImg.src = img.src;
          overlay.style.display = 'flex';
          document.body.style.overflow = 'hidden';
        });
      });

      // Related products
      (function() {
        const related = PRODUCTS.filter(p => p.category === product.category && p.id !== product.id && p.status !== 'soon').slice(0, 3);
        const sec = document.getElementById('relatedSection');
        if (!related.length || !sec) return;
        sec.innerHTML = `
          <div class="related-section">
            <h3 class="related-title">You might also like</h3>
            <div class="related-grid">
              ${related.map(p => {
                const priceHTML = p.status === 'available'
                  ? `<p class="related-price">CHF ${parseFloat(p.priceCHF||0).toFixed(2)}</p>`
                  : `<p class="related-price" style="color:var(--muted);font-size:.75rem">${p.status==='sold-out'?'Sold Out':'Coming Soon'}</p>`;
                return `<a href="product.html?id=${p.id}" class="related-card">
                  <div class="related-img-wrap"><img src="${p.images?.[0]||'COMING SOON.png'}" alt="${p.name}" loading="lazy"></div>
                  <div class="related-info">
                    <div class="related-name">${p.name}</div>
                    ${priceHTML}
                  </div>
                </a>`;
              }).join('')}
            </div>
          </div>`;
      })();

      // Auto-select first available variant
      if (product.variants?.length) {
        const first = main.querySelector('.variant-chip:not([disabled])');
        if (first) selectVariant(first);
      }

      // Init slider
      const allSlides = main.querySelectorAll('.slide');
      const prevBtn   = main.querySelector('.prev');
      const nextBtn   = main.querySelector('.next');
      let cur = 0;
      function showSlide(idx) {
        allSlides[cur].classList.remove('active');
        cur = (idx + allSlides.length) % allSlides.length;
        const next = allSlides[cur];
        // Lazy load on reveal
        if (next.dataset.src && next.src !== next.dataset.src) {
          next.src = next.dataset.src;
        }
        next.classList.add('active');
      }
      if (nextBtn) nextBtn.addEventListener('click', () => showSlide(cur+1));
      if (prevBtn) prevBtn.addEventListener('click', () => showSlide(cur-1));
      document.addEventListener('keydown', e => {
        if(e.key==='ArrowRight') showSlide(cur+1);
        if(e.key==='ArrowLeft')  showSlide(cur-1);
      });

      // Currency switch
      document.getElementById('currencySwitch')?.addEventListener('change', function() {
        localStorage.setItem('fm_currency', this.value);
        const priceEl = main.querySelector('.price[data-chf]');
        if (!priceEl) return;
        if (this.value==='CHF') priceEl.textContent=`CHF ${parseFloat(priceEl.dataset.chf).toFixed(2)}`;
        else if (this.value==='EUR') priceEl.textContent=`€${parseFloat(priceEl.dataset.eur).toFixed(2)}`;
        else priceEl.textContent=`$${parseFloat(priceEl.dataset.usd).toFixed(2)}`;
        // Update variant price if active
        const activeChip = main.querySelector('.variant-chip--active');
        if (activeChip) selectVariant(activeChip);
      });
      // Apply saved/default currency to price on load
      setTimeout(() => {
        const sel = document.getElementById('currencySwitch');
        const priceEl = main.querySelector('.price[data-chf]');
        if (!sel || !priceEl) return;
        if (sel.value==='CHF') priceEl.textContent=`CHF ${parseFloat(priceEl.dataset.chf).toFixed(2)}`;
        else if (sel.value==='EUR') priceEl.textContent=`€${parseFloat(priceEl.dataset.eur).toFixed(2)}`;
      }, 50);

    })();

    // Variant selection
    function shareProduct(platform, name) {
      const url = window.location.href;
      const text = `Check out ${name} on FingerMTB! ${url}`;
      if (platform === 'copy') {
        navigator.clipboard.writeText(url).then(() => {
          const btn = document.querySelector('.share-btn--copy');
          if (btn) { const orig = btn.textContent; btn.textContent = '✓'; setTimeout(() => btn.textContent = orig, 2000); }
        }).catch(() => prompt('Copy this link:', url));
      } else if (platform === 'whatsapp') {
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      } else if (platform === 'instagram') {
        // Instagram doesn't support direct URL share — copy link instead
        navigator.clipboard.writeText(url).then(() => {
          const btn = document.querySelector('.share-btn--ig');
          if (btn) { const orig = btn.innerHTML; btn.textContent = '✓ Copied'; setTimeout(() => btn.innerHTML = orig, 2000); }
          alert('Link copied! Paste it in your Instagram story or DM.');
        });
      }
    }

    async function shareProduct(name, id) {
      const url = `${location.origin}/product.html?id=${id}`;
      if (navigator.share) {
        try {
          await navigator.share({ title: name + ' · FingerMTB', text: 'Check this out: ' + name, url });
          return;
        } catch(e) {}
      }
      // Fallback: copy to clipboard
      try {
        await navigator.clipboard.writeText(url);
        showShareToast('Link copied! 📋');
      } catch(e) {
        prompt('Copy this link:', url);
      }
    }

    function shareWhatsApp(name, id) {
      const url = `${location.origin}/product.html?id=${id}`;
      const text = encodeURIComponent(`Check out ${name} on FingerMTB: ${url}`);
      window.open(`https://wa.me/?text=${text}`, '_blank');
    }

    function showShareToast(msg) {
      let t = document.getElementById('shareToast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'shareToast';
        t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);color:var(--success);border-color:var(--success);border-radius:100px;padding:9px 20px;font-size:.78rem;z-index:9999;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      requestAnimationFrame(() => { t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; });
      setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(20px)'; }, 2500);
    }

    function closeZoom() {
      document.getElementById('zoomOverlay').style.display = 'none';
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if(e.key==='Escape') closeZoom(); });

    function selectVariant(btn) {
      document.querySelectorAll('.variant-chip').forEach(b => b.classList.remove('variant-chip--active'));
      btn.classList.add('variant-chip--active');

      const link     = btn.dataset.link;
      const status   = btn.dataset.status;
      const priceCHF = btn.dataset.pricechf;
      const priceUSD = btn.dataset.priceusd;
      const priceEUR = btn.dataset.priceeur;

      const buyBtn = document.getElementById('variantBuyBtn');
      const buyLbl = document.getElementById('variantBuyLabel');
      if (!buyBtn) return;

      if (status==='sold-out') {
        buyBtn.classList.add('buy-btn--disabled');
        buyBtn.removeAttribute('href');
        if (buyLbl) buyLbl.textContent = 'Sold Out';
      } else if (link) {
        buyBtn.classList.remove('buy-btn--disabled');
        buyBtn.href = link;
        if (buyLbl) buyLbl.textContent = 'Buy Now';
      } else {
        buyBtn.classList.add('buy-btn--disabled');
        buyBtn.removeAttribute('href');
        if (buyLbl) buyLbl.textContent = 'Not available';
      }

      const priceEl = document.querySelector('.price[data-chf]');
      if (priceEl && priceCHF) {
        const sel = document.getElementById('currencySwitch')?.value || 'USD';
        if (sel==='CHF') priceEl.textContent=`CHF ${parseFloat(priceCHF).toFixed(2)}`;
        else if (sel==='EUR') priceEl.textContent=`€${parseFloat(priceEUR||0).toFixed(2)}`;
        else priceEl.textContent=`$${parseFloat(priceUSD||0).toFixed(2)}`;
      }
    }
  </script>
</body>
</html>
