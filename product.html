<head>

</head>
<body>

  <header class="site-header">

      <div class="brand"><h1>FingerMTB</h1><p class="tagline">Mini Bikes · Big Tricks</p></div>
      <button class="menu-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <nav class="main-nav">
        <a href="index.html">Home</a><a href="shop.html">Shop</a>
        <a href="projects.html">Projects</a><a href="about.html">About</a>
        <a href="index.html#entryform">Contact</a>
      </nav>
      <div class="header-right">
        <div class="social-links" id="header-social" style="display:none">
          <a id="header-instagram" href="#" target="_blank" rel="noopener" style="display:none" aria-label="Instagram">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </a>
          <a id="header-tiktok" href="#" target="_blank" rel="noopener" style="display:none" aria-label="TikTok">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.76a4.85 4.85 0 01-1.01-.07z"/></svg>
          </a>
        </div>
        <select id="currencySwitch">
          <option value="USD">$ USD</option>
          <option value="CHF">CHF</option>
          <option value="EUR">€ EUR</option>
        </select>
      </div>
    </div>
  </header>

  <main id="productMain"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">FingerMTB</div>
      <div class="footer-center">
        <div class="social-links" id="footer-social" style="display:none">
          <a id="footer-instagram" href="#" target="_blank" rel="noopener" style="display:none" aria-label="Instagram">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </a>
          <a id="footer-tiktok" href="#" target="_blank" rel="noopener" style="display:none" aria-label="TikTok">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.76a4.85 4.85 0 01-1.01-.07z"/></svg>
          </a>
        </div>
        <a href="privacy.html" style="font-size:.75rem;color:rgba(255,255,255,.4)">Privacy Policy</a>
      </div>
      <div class="footer-copy">
        <p id="footer-line1">BrickJ_mtb · Handmade in Switzerland 🇨🇭</p>
        <p id="footer-line2">No cookies 🍪</p>
      </div>
    </div>
  </footer>

  <div class="admin-entry" title="Admin"><a href="/dashboard-brickj.html">⚙</a></div>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    function deepMerge(base, over) {
      const r={...base};
      for(const k in over){
        if(over[k]&&typeof over[k]==='object'&&!Array.isArray(over[k])) r[k]=deepMerge(base[k]||{},over[k]);
        else r[k]=over[k];
      }
      return r;
    }
    function getCfg() {
      try {
        const s=JSON.parse(localStorage.getItem('fm_cfg')||'{}');
        return deepMerge(typeof SITE_CONFIG!=='undefined'?SITE_CONFIG:{},s.siteConfig||{});
      } catch { return typeof SITE_CONFIG!=='undefined'?SITE_CONFIG:{}; }
    }
    const cfg = getCfg();

    // Footer
    if(cfg.footer?.line1) document.getElementById('footer-line1').textContent=cfg.footer.line1;
    if(cfg.footer?.line2) document.getElementById('footer-line2').textContent=cfg.footer.line2;

    // Social links
    function setSocialLink(prefix, platform, url) {
      const el=document.getElementById(`${prefix}-${platform}`);
      if(el&&url){el.href=url;el.style.display='inline-flex';}
    }
    if(cfg.social?.enabled!==false && (cfg.social?.instagram||cfg.social?.tiktok)) {
      const pos=cfg.social?.position||'both';
      if(pos==='header'||pos==='both'){
        document.getElementById('header-social').style.display='flex';
        setSocialLink('header','instagram',cfg.social.instagram);
        setSocialLink('header','tiktok',cfg.social.tiktok);
      }
      if(pos==='footer'||pos==='both'){
        document.getElementById('footer-social').style.display='flex';
        setSocialLink('footer','instagram',cfg.social.instagram);
        setSocialLink('footer','tiktok',cfg.social.tiktok);
      }
    }

    // Product render
    (function() {
      const params = new URLSearchParams(location.search);
      let id = params.get('id');
      const main = document.getElementById('productMain');
      if(!id){showNotFound();return;}
      if(typeof LEGACY_MAP!=='undefined'&&LEGACY_MAP[id]) id=LEGACY_MAP[id];
      const product = PRODUCTS.find(p=>p.id===id);
      if(!product){showNotFound();return;}

      document.title = `${product.name} · FingerMTB`;

      const badgeClass = {available:'status-available','sold-out':'status-sold-out',soon:'status-soon'}[product.status];
      const badgeLabel = {available:'In Stock','sold-out':'Sold Out',soon:'Coming Soon'}[product.status];

      const slides = product.images.map((src,i)=>
        `<img src="${src}" alt="${product.name}" class="slide${i===0?' active':''}" loading="${i===0?'eager':'lazy'}">`
      ).join('');

      const specItems = product.specs?.length
        ? `<ul>${product.specs.map(s=>`<li>${s}</li>`).join('')}</ul>` : '';

      const noteHTML = product.note
        ? `<div class="product-note">ℹ️ ${product.note}</div>` : '';

      const trustBadge = cfg.trust?.badge
        ? `<span class="trust-badge">${cfg.trust.badge}</span>` : '';
      const shipBadge = cfg.trust?.shipping
        ? `<span class="trust-badge trust-badge--shipping">🚚 ${cfg.trust.shipping}</span>` : '';

      // Buy button OR sold-out section
      // Buy section — updates dynamically when variant selected
      let buySection = '';
      const hasVariants = product.variants?.length > 0;
      if (hasVariants) {
        // Show placeholder — JS fills in after variant selection
        buySection = `
          <a class="buy-btn buy-btn--disabled" id="variantBuyBtn" href="#" target="_blank" rel="noopener">
            <span class="buy-btn-icon">🛒</span>
            <span id="variantBuyLabel">Select an option above</span>
            <span class="buy-btn-arrow">→</span>
          </a>`;
      } else if(product.status==='available' && product.etsyLink) {
        buySection = `
          <a class="buy-btn" href="${product.etsyLink}" target="_blank" rel="noopener">
            <span class="buy-btn-icon">🛒</span>
            <span data-etsy-label="${product.etsyLabel||'Buy Now'}">${product.etsyLabel||'Buy Now'}</span>
            <span class="buy-btn-arrow">→</span>
          </a>`;
      } else if(product.status==='sold-out') {
        buySection = `<div class="buy-btn buy-btn--disabled">Sold Out</div>`;
      } else {
        buySection = `<div class="buy-btn buy-btn--disabled">${badgeLabel}</div>`;
      }

      // Size reference
      const sizeHTML = (cfg.sizeref?.enabled!==false && cfg.sizeref?.title) ? `
        <div class="size-reference">
          ${cfg.sizeref.image ? `<img src="${cfg.sizeref.image}" alt="Grössenreferenz" class="size-ref-img">` : ''}
          <div class="size-ref-text">
            <span class="size-ref-icon">📏</span>
            <div>
              <strong>${cfg.sizeref.title}</strong>
              ${cfg.sizeref.text?`<p>${cfg.sizeref.text}</p>`:''}
            </div>
          </div>
        </div>` : '';

      // Build variants
      let variantsHTML = '';
      if (product.variants?.length) {
        const chips = product.variants.map((v, i) => {
          const effectiveStatus = v.status || product.status;
          const isSoldOut = effectiveStatus === 'sold-out';
          const colorDot = v.color
            ? `<span style="width:12px;height:12px;border-radius:50%;background:${v.color};display:inline-block;flex-shrink:0;border:1.5px solid rgba(255,255,255,.25)"></span>`
            : '';
          return `<button
            class="variant-chip${isSoldOut?' variant-chip--soldout':''}"
            data-index="${i}"
            data-link="${v.link||product.etsyLink||''}"
            data-label="${v.label}"
            data-pricechf="${v.priceCHF||product.priceCHF}"
            data-priceusd="${product.priceUSD}"
            data-priceeur="${product.priceEUR}"
            data-status="${effectiveStatus}"
            onclick="selectVariant(this)"
            ${isSoldOut?'disabled':''}>
            ${colorDot}
            <span>${v.label}</span>
            ${isSoldOut?'<span style="font-size:.6rem;opacity:.6">(sold out)</span>':''}
          </button>`;
        }).join('');
        variantsHTML = `<div class="variants-section anim-fade-up" style="animation-delay:.2s">
          <div class="variants-label">Choose option</div>
          <div class="variants-chips">${chips}</div>
        </div>`;
      }

      // Build media section (videos, gifs, youtube)
      let mediaHTML = '';
      const mediaItems = product.media || [];
      if (mediaItems.length) {
        const mediaCards = mediaItems.map(m => {
          if (m.type === 'youtube') {
            const ytId = m.url.match(/(?:v=|youtu\.be\/)([^&\?]+)/)?.[1] || m.url;
            return `<div class="media-card anim-fade-up">
              <div class="media-youtube">
                <iframe src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                </iframe>
              </div>
              ${m.caption?`<p class="media-caption">${m.caption}</p>`:''}
            </div>`;
          } else if (m.type === 'video') {
            return `<div class="media-card anim-fade-up">
              <video src="${m.url}" controls playsinline loop muted class="media-video"></video>
              ${m.caption?`<p class="media-caption">${m.caption}</p>`:''}
            </div>`;
          } else if (m.type === 'gif') {
            return `<div class="media-card anim-fade-up">
              <img src="${m.url}" alt="${m.caption||'Animation'}" class="media-gif" loading="lazy">
              ${m.caption?`<p class="media-caption">${m.caption}</p>`:''}
            </div>`;
          }
          return '';
        }).join('');
        mediaHTML = `<div class="media-section"><h3 class="media-section-title anim-fade-up">In Action</h3><div class="media-grid">${mediaCards}</div></div>`;
      }

      main.innerHTML = `
        <section class="product-hero">
          <div class="productimgbox">
            <div class="slider">
              <button class="prev" aria-label="Previous">‹</button>
              <div class="slides">${slides}</div>
              <button class="next" aria-label="Next">›</button>
            </div>
          </div>
          <div class="pricedescription">
            <span class="status-badge ${badgeClass}">${badgeLabel}</span>
            <h2 class="product-name-heading">${product.name}</h2>
            <p class="price" data-usd="${product.priceUSD}" data-chf="${product.priceCHF}" data-eur="${product.priceEUR}">
              $${product.priceUSD.toFixed(2)}
            </p>
            <p class="product-description anim-hero" style="animation-delay:.15s">${product.description}</p>
            ${variantsHTML ? variantsHTML.replace(/anim-fade-up/g,"anim-hero") : ""}
            <div class="anim-fade-up" class="anim-hero" style="animation-delay:.25s">${buySection}</div>
            <div class="trust-badges anim-fade-up" class="anim-hero" style="animation-delay:.35s">${trustBadge}${shipBadge}</div>
            ${sizeHTML ? `<div class="anim-hero" style="animation-delay:.4s">${sizeHTML}</div>` : ''}
            <div class="details anim-hero" style="animation-delay:.45s">${specItems?`<h3>Specs</h3>${specItems}`:''}</div>
            ${noteHTML ? `<div class="anim-hero" style="animation-delay:.5s">${noteHTML}</div>` : ''}
          </div>
        </section>
        ${mediaHTML}`;

      // Scroll-triggered reveal for elements below the fold
      const revealObs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('in-view');
            revealObs.unobserve(e.target);
          }
        });
      }, { threshold: 0.12 });
      main.querySelectorAll('.anim-fade-up, .media-card, .anim-hero').forEach((el,i) => {
        el.style.setProperty('--delay', `${i * 0.07}s`);
        revealObs.observe(el);
      });

      initSlider();

      // Auto-select first available variant
      if (product.variants?.length) {
        const firstAvail = main.querySelector('.variant-chip:not([disabled])');
        if (firstAvail) selectVariant(firstAvail);
      }

      // Currency switch
      document.getElementById('currencySwitch')?.addEventListener('change', function() {
        const priceEl = main.querySelector('.price');
        if(!priceEl) return;
        if(this.value==='CHF') priceEl.textContent=`CHF ${parseFloat(priceEl.dataset.chf).toFixed(2)}`;
        else if(this.value==='EUR') priceEl.textContent=`€${parseFloat(priceEl.dataset.eur).toFixed(2)}`;
        else priceEl.textContent=`$${parseFloat(priceEl.dataset.usd).toFixed(2)}`;
      });

      function showNotFound() {
        document.title='Not found · FingerMTB';
        main.innerHTML=`<div class="not-found"><h2>Product not found 🤷</h2><p>This product doesn't exist or has been removed.</p><a href="shop.html" class="btn-primary">Back to Shop</a></div>`;
      }

      function initSlider() {
        const slides=main.querySelectorAll('.slide');
        const prev=main.querySelector('.prev');
        const next=main.querySelector('.next');
        if(!slides.length||!prev) return;
        let cur=0;
        function show(idx){
          slides[cur].classList.remove('active');
          cur=(idx+slides.length)%slides.length;
          slides[cur].classList.add('active');
        }
        next.addEventListener('click',()=>show(cur+1));
        prev.addEventListener('click',()=>show(cur-1));
        document.addEventListener('keydown',e=>{
          if(e.key==='ArrowRight')show(cur+1);
          if(e.key==='ArrowLeft')show(cur-1);
        });
      }
    })();

    // Notify submit — sends to Google Forms
    function submitNotify(productId, productName) {
      const email = document.getElementById('notifyEmail')?.value?.trim();
      if(!email || !email.includes('@')) { alert('Please enter a valid email address'); return; }

      // Save locally so admin can see it
      const notifications = JSON.parse(localStorage.getItem('fm_notify')||'[]');
      notifications.push({email, productId, productName, date: new Date().toISOString()});
      localStorage.setItem('fm_notify', JSON.stringify(notifications));

      // Send notification email to shop owner via mailto
      const subject = encodeURIComponent(`Restock request: ${productName}`);
      const body = encodeURIComponent(
        `Someone wants to be notified when ${productName} is back in stock.

Email: ${email}
Product: ${productName}
Date: ${new Date().toLocaleString()}`
      );
      // Opens email app silently in background via hidden iframe
      const link = `mailto:jami.brick@gmail.com?subject=${subject}&body=${body}`;
    function selectVariant(btn) {
      // deselect all
      document.querySelectorAll('.variant-chip').forEach(b => b.classList.remove('variant-chip--active'));
      btn.classList.add('variant-chip--active');

      const link     = btn.dataset.link;
      const priceCHF = btn.dataset.pricechf;
      const priceUSD = btn.dataset.priceusd;
      const priceEUR = btn.dataset.priceeur;
      const status   = btn.dataset.status;
      const buyBtn   = document.getElementById('variantBuyBtn');
      const buyLbl   = document.getElementById('variantBuyLabel');

      if (!buyBtn) return;

      if (status === 'sold-out') {
        buyBtn.classList.add('buy-btn--disabled');
        buyBtn.removeAttribute('href');
        if (buyLbl) buyLbl.textContent = 'Sold Out';
      } else if (link) {
        buyBtn.classList.remove('buy-btn--disabled');
        buyBtn.href = link;
        if (buyLbl) buyLbl.textContent = 'Buy Now';
      } else {
        buyBtn.classList.add('buy-btn--disabled');
        buyBtn.removeAttribute('href');
        if (buyLbl) buyLbl.textContent = 'Not available';
      }

      // Update price display
      const priceEl = document.querySelector('.price[data-chf]');
      if (priceEl && priceCHF) {
        const sel = document.getElementById('currencySwitch')?.value || 'USD';
        if (sel === 'CHF') priceEl.textContent = `CHF ${parseFloat(priceCHF).toFixed(2)}`;
        else if (sel === 'EUR') priceEl.textContent = `€${parseFloat(priceEUR||0).toFixed(2)}`;
        else priceEl.textContent = `$${parseFloat(priceUSD||0).toFixed(2)}`;
      }
    }
  </script>
</body>
</html>
