<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product · FingerMTB</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon-32x32.png">
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "70a7302f8a694fa897ff479afcb93500"}'></script>
</head>
<body>

  <header class="site-header">
    <div class="container flex-between">
      <div class="brand">
        <h1>FingerMTB</h1>
        <p class="tagline">Mini Bikes · Big Tricks</p>
      </div>
      <button class="menu-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="index.html#entryform">Contact</a>
      </nav>
      <div class="cart-container">
        <select id="currencySwitch">
          <option value="USD">$ USD</option>
          <option value="CHF">CHF</option>
          <option value="EUR">€ EUR</option>
        </select>
      </div>
    </div>
  </header>

  <main id="productMain"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">FingerMTB</div>
      <div class="footer-links"><a href="privacy.html" id="footer-privacy">Privacy Policy</a></div>
      <div class="footer-copy">
        <p id="footer-line1">BrickJ_mtb · Handmade in Switzerland 🇨🇭</p>
        <p id="footer-line2">No cookies 🍪</p>
      </div>
    </div>
  </footer>

  <div class="admin-entry" title="Admin"><a href="/dashboard-brickj.html">⚙</a></div>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    // ── Config merge ──
    function getCfg() {
      try {
        const stored = JSON.parse(localStorage.getItem('fm_cfg') || '{}');
        function deepMerge(base, override) {
          const r = Object.assign({}, base);
          for (const k in override) {
            if (override[k] && typeof override[k] === 'object' && !Array.isArray(override[k]))
              r[k] = deepMerge(base[k] || {}, override[k]);
            else r[k] = override[k];
          }
          return r;
        }
        return deepMerge(SITE_CONFIG, stored.siteConfig || {});
      } catch { return SITE_CONFIG; }
    }
    const cfg = getCfg();

    // Footer
    const el = id => document.getElementById(id);
    if (el('footer-line1')) el('footer-line1').textContent = cfg.footer.line1;
    if (el('footer-line2')) el('footer-line2').textContent = cfg.footer.line2;
    if (el('footer-privacy')) el('footer-privacy').textContent = cfg.footer.privacyText;

    // ── Product render ──
    (function() {
      const params = new URLSearchParams(location.search);
      let id = params.get('id');
      const main = document.getElementById('productMain');
      if (!id) { showNotFound(); return; }

      // Legacy redirect
      if (typeof LEGACY_MAP !== 'undefined' && LEGACY_MAP[id]) id = LEGACY_MAP[id];

      const product = PRODUCTS.find(p => p.id === id);
      if (!product) { showNotFound(); return; }

      document.title = `${product.name} · FingerMTB`;

      const badgeClass = { available:'status-available','sold-out':'status-sold-out',soon:'status-soon' }[product.status];
      const badgeLabel = { available:'In Stock','sold-out':'Sold Out',soon:'Coming Soon' }[product.status];

      const slides = product.images.map((src, i) =>
        `<img src="${src}" alt="${product.name}" class="slide${i===0?' active':''}" loading="${i===0?'eager':'lazy'}">`
      ).join('');

      const specItems = product.specs.length
        ? `<ul>${product.specs.map(s=>`<li>${s}</li>`).join('')}</ul>` : '';

      const noteHTML = product.note
        ? `<div class="product-note">ℹ️ ${product.note}</div>` : '';

      const trustBadge = cfg.trust?.badge
        ? `<span class="trust-badge">${cfg.trust.badge}</span>` : '';

      const shippingBadge = cfg.trust?.shipping
        ? `<span class="trust-badge trust-badge--shipping">🚚 ${cfg.trust.shipping}</span>` : '';

      // Buy Button — prominent
      let buyBtn = '';
      if (product.status === 'available' && product.etsyLink) {
        buyBtn = `
          <a class="buy-btn" href="${product.etsyLink}" target="_blank" rel="noopener">
            <span class="buy-btn-icon">🛒</span>
            <span>${product.etsyLabel || 'Buy Now'}</span>
            <span class="buy-btn-arrow">→</span>
          </a>`;
      } else {
        buyBtn = `<div class="buy-btn buy-btn--disabled">${badgeLabel}</div>`;
      }

      main.innerHTML = `
        <section class="product-container">
          <div class="productimgbox">
            <div class="slider">
              <button class="prev" aria-label="Previous">‹</button>
              <div class="slides">${slides}</div>
              <button class="next" aria-label="Next">›</button>
            </div>
          </div>
          <div class="pricedescription">
            <span class="status-badge ${badgeClass}">${badgeLabel}</span>
            <h2>${product.name}</h2>
            <p class="price" data-usd="${product.priceUSD}" data-chf="${product.priceCHF}" data-eur="${product.priceEUR}">
              $${product.priceUSD.toFixed(2)}
            </p>
            <p class="product-description">${product.description}</p>
            ${buyBtn}
            <div class="trust-badges">
              ${trustBadge}
              ${shippingBadge}
            </div>
            <div class="details">
              ${specItems ? `<h3>Specs</h3>${specItems}` : ''}
            </div>
            ${noteHTML}
          </div>
        </section>`;

      initSlider();

      document.getElementById('currencySwitch').addEventListener('change', function() {
        const priceEl = main.querySelector('.price');
        if (!priceEl) return;
        const sel = this.value;
        if (sel === 'CHF') priceEl.textContent = `CHF ${parseFloat(priceEl.dataset.chf).toFixed(2)}`;
        else if (sel === 'EUR') priceEl.textContent = `€${parseFloat(priceEl.dataset.eur).toFixed(2)}`;
        else priceEl.textContent = `$${parseFloat(priceEl.dataset.usd).toFixed(2)}`;
      });

      function showNotFound() {
        document.title = 'Not found · FingerMTB';
        main.innerHTML = `
          <div class="not-found">
            <h2>Product not found 🤷</h2>
            <p>This product doesn't exist or has been removed.</p>
            <a href="shop.html" class="btn-primary">Back to Shop</a>
          </div>`;
      }

      function initSlider() {
        const slides = main.querySelectorAll('.slide');
        const prev = main.querySelector('.prev');
        const next = main.querySelector('.next');
        if (!slides.length || !prev) return;
        let cur = 0;
        function show(idx) {
          slides[cur].classList.remove('active');
          cur = (idx + slides.length) % slides.length;
          slides[cur].classList.add('active');
        }
        next.addEventListener('click', () => show(cur+1));
        prev.addEventListener('click', () => show(cur-1));
        document.addEventListener('keydown', e => {
          if (e.key === 'ArrowRight') show(cur+1);
          if (e.key === 'ArrowLeft') show(cur-1);
        });
      }
    })();
  </script>
</body>
</html>
