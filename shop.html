<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop · FingerMTB</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon-32x32.png">
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "70a7302f8a694fa897ff479afcb93500"}'></script>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container flex-between">
      <div class="brand">
        <h1>FingerMTB</h1>
        <p class="tagline">Mini Bikes · Big Tricks</p>
      </div>
      <button class="menu-toggle" aria-label="Toggle menu">☰</button>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="shop.html" class="active">Shop</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="index.html#entryform">Contact</a>
      </nav>
      <div class="cart-container">
        <select id="currencySwitch">
          <option value="USD">$ USD</option>
          <option value="CHF">CHF</option>
          <option value="EUR">€ EUR</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <!-- FINGER SKIS -->
    <h1 style="text-align:center; margin-top:50px; margin-bottom:50px;">Finger Skis</h1>
    <section class="products" id="grid-ski"></section>

    <!-- OBSTACLES -->
    <h1 style="text-align:center; margin-top:50px; margin-bottom:50px;">Obstacles & Rails</h1>
    <section class="products" id="grid-obstacle"></section>

    <!-- FINGER MTB -->
    <h1 style="text-align:center; margin-top:50px; margin-bottom:50px;">Finger MTB's</h1>
    <section class="products" id="grid-mtb"></section>

    <!-- KITS -->
    <h1 style="text-align:center; margin-top:50px; margin-bottom:50px;">Kits</h1>
    <section class="products" id="grid-kit"></section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <p>BrickJ_mtb · This site was coded by me 😊</p>
      <p>This site doesn't use cookies 🍪</p>
      <p><a href="privacy.html">Privacy Policy ➔</a></p>
    </div>
  </footer>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
  // shop.html inline — products.js ist bereits geladen
    // Kategorien → Grid-IDs
    const GRIDS = {
      ski:      document.getElementById('grid-ski'),
      obstacle: document.getElementById('grid-obstacle'),
      mtb:      document.getElementById('grid-mtb'),
      kit:      document.getElementById('grid-kit'),
    };

    // Status Label + Badge Farbe
    function statusHTML(status) {
      const map = {
        available: ['In Stock', '#d4edda', '#155724'],
        'sold-out': ['Sold Out', '#f8d7da', '#721c24'],
        soon:       ['Coming Soon', '#fff3cd', '#856404'],
      };
      const [label, bg, color] = map[status] || ['', '#eee', '#333'];
      return `<span style="display:inline-block; padding:2px 10px; border-radius:20px; font-size:0.75rem; font-weight:600; background:${bg}; color:${color}; margin-bottom:6px;">${label}</span>`;
    }

    // Produktkarte bauen
    function buildCard(p) {
      const img = (p.images && p.images.length > 0) ? p.images[0] : 'COMING SOON.png';
      const priceHTML = p.status === 'available'
        ? `<p class="price" data-usd="${p.priceUSD}" data-chf="${p.priceCHF}" data-eur="${p.priceEUR}">$${p.priceUSD.toFixed(2)}</p>`
        : '';

      return `
        <div class="product">
          <img src="${img}" alt="${p.name}" loading="lazy">
          <h2>${p.name}</h2>
          ${statusHTML(p.status)}
          ${priceHTML}
          <button><a href="product.html?id=${p.id}">See More</a></button>
        </div>`;
    }

    // Alle Produkte in die richtigen Grids
    PRODUCTS.forEach(p => {
      const grid = GRIDS[p.category];
      if (grid) grid.innerHTML += buildCard(p);
    });

    // Leere Sektionen verstecken
    Object.entries(GRIDS).forEach(([cat, el]) => {
      if (!el.innerHTML.trim()) {
        el.previousElementSibling.style.display = 'none';
        el.style.display = 'none';
      }
    });

    // Währungsswitch
    document.getElementById('currencySwitch').addEventListener('change', function () {
      const sel = this.value;
      document.querySelectorAll('.price').forEach(el => {
        if (!el.dataset.usd) return;
        if (sel === 'CHF') el.textContent = `CHF ${parseFloat(el.dataset.chf).toFixed(2)}`;
        else if (sel === 'EUR') el.textContent = `€${parseFloat(el.dataset.eur).toFixed(2)}`;
        else el.textContent = `$${parseFloat(el.dataset.usd).toFixed(2)}`;
      });
    });
  </script>

</body>
</html>
