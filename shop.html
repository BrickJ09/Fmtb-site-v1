<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop · FingerMTB</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon-32x32.png">
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "70a7302f8a694fa897ff479afcb93500"}'></script>
</head>
<body>

  <header class="site-header">
    <div class="container flex-between">
      <div class="brand">
        <h1>FingerMTB</h1>
        <p class="tagline">Mini Bikes · Big Tricks</p>
      </div>
      <button class="menu-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="shop.html" class="active">Shop</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="index.html#entryform">Contact</a>
      </nav>
      <div class="cart-container">
        <select id="currencySwitch">
          <option value="USD">$ USD</option>
          <option value="CHF">CHF</option>
          <option value="EUR">€ EUR</option>
        </select>
      </div>
    </div>
  </header>

  <main class="shop-main">

    <div class="shop-hero">
      <div class="shop-hero-content">
        <p class="shop-hero-eyebrow">The Collection</p>
        <h1 class="shop-hero-title">Shop</h1>
        <p class="shop-hero-sub">Handcrafted 3D-printed miniatures for the culture</p>
      </div>
    </div>

    <div class="shop-categories">
      <button class="cat-btn active" data-cat="all">All</button>
      <button class="cat-btn" data-cat="ski">Finger Skis</button>
      <button class="cat-btn" data-cat="obstacle">Obstacles</button>
      <button class="cat-btn" data-cat="mtb">Finger MTB</button>
      <button class="cat-btn" data-cat="kit">Kits</button>
    </div>

    <section class="shop-section" id="section-ski">
      <div class="section-header-row">
        <h2 class="section-label">Finger Skis</h2>
        <div class="section-line"></div>
      </div>
      <div class="products" id="grid-ski"></div>
    </section>

    <section class="shop-section" id="section-obstacle">
      <div class="section-header-row">
        <h2 class="section-label">Obstacles & Rails</h2>
        <div class="section-line"></div>
      </div>
      <div class="products" id="grid-obstacle"></div>
    </section>

    <section class="shop-section" id="section-mtb">
      <div class="section-header-row">
        <h2 class="section-label">Finger MTB's</h2>
        <div class="section-line"></div>
      </div>
      <div class="products" id="grid-mtb"></div>
    </section>

    <section class="shop-section" id="section-kit">
      <div class="section-header-row">
        <h2 class="section-label">Kits</h2>
        <div class="section-line"></div>
      </div>
      <div class="products" id="grid-kit"></div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">FingerMTB</div>
      <div class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
      </div>
      <div class="footer-copy">
        <p>BrickJ_mtb · Coded with ❤️</p>
        <p>No cookies 🍪</p>
      </div>
    </div>
  </footer>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    const GRIDS = {
      ski:      document.getElementById('grid-ski'),
      obstacle: document.getElementById('grid-obstacle'),
      mtb:      document.getElementById('grid-mtb'),
      kit:      document.getElementById('grid-kit'),
    };

    function statusHTML(status) {
      const map = {
        available:  ['In Stock',    'badge-available'],
        'sold-out': ['Sold Out',    'badge-soldout'],
        soon:       ['Coming Soon', 'badge-soon'],
      };
      const [label, cls] = map[status] || ['', ''];
      return `<span class="product-badge ${cls}">${label}</span>`;
    }

    function buildCard(p) {
      const img = (p.images && p.images.length > 0) ? p.images[0] : 'COMING SOON.png';
      const priceHTML = p.status === 'available'
        ? `<p class="price" data-usd="${p.priceUSD}" data-chf="${p.priceCHF}" data-eur="${p.priceEUR}">$${p.priceUSD.toFixed(2)}</p>`
        : '';
      return `
        <div class="product" data-cat="${p.category}">
          <div class="product-img-wrap">
            <img src="${img}" alt="${p.name}" loading="lazy">
            ${statusHTML(p.status)}
          </div>
          <div class="product-info">
            <h2 class="product-name">${p.name}</h2>
            ${priceHTML}
            <a class="product-btn" href="product.html?id=${p.id}">See More →</a>
          </div>
        </div>`;
    }

    PRODUCTS.forEach(p => {
      const grid = GRIDS[p.category];
      if (grid) grid.innerHTML += buildCard(p);
    });

    Object.entries(GRIDS).forEach(([cat, el]) => {
      if (!el.innerHTML.trim()) {
        const section = document.getElementById(`section-${cat}`);
        if (section) section.style.display = 'none';
      }
    });

    // Animate on scroll
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.product').forEach((card, i) => {
      card.style.transitionDelay = `${(i % 6) * 0.07}s`;
      observer.observe(card);
    });

    // Category filter
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const cat = this.dataset.cat;
        document.querySelectorAll('.shop-section').forEach(sec => {
          const id = sec.id.replace('section-', '');
          sec.style.display = (cat === 'all' || id === cat) ? '' : 'none';
        });
      });
    });

    // Currency
    document.getElementById('currencySwitch').addEventListener('change', function () {
      const sel = this.value;
      document.querySelectorAll('.price').forEach(el => {
        if (!el.dataset.usd) return;
        if (sel === 'CHF') el.textContent = `CHF ${parseFloat(el.dataset.chf).toFixed(2)}`;
        else if (sel === 'EUR') el.textContent = `€${parseFloat(el.dataset.eur).toFixed(2)}`;
        else el.textContent = `$${parseFloat(el.dataset.usd).toFixed(2)}`;
      });
    });

    // Hamburger
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.main-nav');
    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');
      toggle.classList.toggle('open');
    });
  </script>
</body>
</html>
