<body>

          <a id="header-tiktok" href="#" target="_blank" rel="noopener" aria-label="TikTok" style="display:none">

          </a>
        </div>
        <select id="currencySwitch">
          <option value="USD">$ USD</option>
          <option value="CHF">CHF</option>

    </div>

  <main class="container" style="padding-top:40px;padding-bottom:60px">

    <div id="section-obstacle">

      <div class="products" id="grid-obstacle"></div>

    <div id="section-mtb">

      <div class="products" id="grid-mtb"></div>

    <div id="section-kit">
      <h2 class="shop-section-title">Kits</h2>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">FingerMTB</div>
      <div class="footer-center">
        <div class="social-links" id="footer-social" style="display:none">
          <a id="footer-instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram" style="display:none">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </a>
          <a id="footer-tiktok" href="#" target="_blank" rel="noopener" aria-label="TikTok" style="display:none">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.76a4.85 4.85 0 01-1.01-.07z"/></svg>
          </a>
        </div>
        <a href="privacy.html" style="font-size:.75rem;color:rgba(255,255,255,.4)">Privacy Policy</a>
      </div>
      <div class="footer-copy">
        <p id="footer-line1">BrickJ_mtb · Handmade in Switzerland 🇨🇭</p>
        <p id="footer-line2">No cookies 🍪</p>
      </div>
    </div>
  </footer>

  <div class="admin-entry" title="Admin"><a href="/dashboard-brickj.html">⚙</a></div>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    // Config
    function deepMerge(b,o){const r={...b};for(const k in o){if(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))r[k]=deepMerge(b[k]||{},o[k]);else r[k]=o[k];}return r;}
    const cfg=(()=>{try{const s=JSON.parse(localStorage.getItem('fm_cfg')||'{}');return deepMerge(typeof SITE_CONFIG!=='undefined'?SITE_CONFIG:{},s.siteConfig||{});}catch{return typeof SITE_CONFIG!=='undefined'?SITE_CONFIG:{};}})();

    // Footer
    if(cfg.footer?.line1) document.getElementById('footer-line1').textContent=cfg.footer.line1;
    if(cfg.footer?.line2) document.getElementById('footer-line2').textContent=cfg.footer.line2;

    // Social
    if(cfg.social?.enabled!==false&&(cfg.social?.instagram||cfg.social?.tiktok)){
      const pos=cfg.social?.position||'both';
      function setS(prefix,platform,url){const el=document.getElementById(`${prefix}-${platform}`);if(el&&url){el.href=url;el.style.display='inline-flex';}}
      if(pos==='header'||pos==='both'){document.getElementById('header-social').style.display='flex';setS('header','instagram',cfg.social.instagram);setS('header','tiktok',cfg.social.tiktok);}
      if(pos==='footer'||pos==='both'){document.getElementById('footer-social').style.display='flex';setS('footer','instagram',cfg.social.instagram);setS('footer','tiktok',cfg.social.tiktok);}
    }

    const GRIDS = {
      ski:      document.getElementById('grid-ski'),
      obstacle: document.getElementById('grid-obstacle'),
      mtb:      document.getElementById('grid-mtb'),
      kit:      document.getElementById('grid-kit'),
    };

    const STATUS_MAP = {
      available: ['In Stock',   '#00a86b','rgba(0,168,107,0.1)','rgba(0,168,107,0.2)'],
      'sold-out':['Sold Out',   '#e8263a','rgba(232,38,58,0.08)','rgba(232,38,58,0.15)'],
      soon:      ['Coming Soon','#b07800','rgba(255,193,0,0.12)','rgba(255,193,0,0.2)'],
    };

    function buildCard(p) {
      const img = p.images?.[0] || 'COMING SOON.png';
      const [label,color,bg,border] = STATUS_MAP[p.status] || ['','#888','#eee','#ccc'];
      const priceHTML = p.status==='available'
        ? `<p class="price" data-usd="${p.priceUSD}" data-chf="${p.priceCHF}" data-eur="${p.priceEUR}" style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#0057ff;padding:0 14px 2px;letter-spacing:.04em;">$${p.priceUSD.toFixed(2)}</p>` : '';
      return `
        <div class="product visible">
          <div style="aspect-ratio:4/3;overflow:hidden;background:#f0efe9">
            <img src="${img}" alt="${p.name}" loading="lazy" style="width:100%;height:100%;object-fit:cover;transition:transform .4s ease">
          </div>
          <div style="padding:14px">
            <span style="display:inline-block;padding:3px 10px;border-radius:100px;font-size:.65rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:${color};background:${bg};border:1.5px solid ${border};margin-bottom:6px">${label}</span>
            <h3 style="font-size:.9rem;font-weight:700;margin-bottom:6px;line-height:1.3">${p.name}</h3>
            ${priceHTML}
            <a href="product.html?id=${p.id}" style="display:inline-block;margin-top:8px;padding:8px 20px;background:#ff6b00;color:#fff;font-weight:700;font-size:.78rem;border-radius:100px;text-decoration:none;transition:opacity .15s" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">View Details →</a>
          </div>
        </div>`;
    }

    PRODUCTS.forEach(p => {
      const grid = GRIDS[p.category];
      if (grid) grid.innerHTML += buildCard(p);
    });

    // Hide empty sections
    ['ski','obstacle','mtb','kit'].forEach(cat => {
      const grid = GRIDS[cat];
      const section = document.getElementById('section-'+cat);
      if (grid && !grid.innerHTML.trim()) section.style.display='none';
    });

    // Currency switch
    document.getElementById('currencySwitch').addEventListener('change', function(){
      const sel=this.value;
      document.querySelectorAll('.price[data-usd]').forEach(el=>{
        if(sel==='CHF') el.textContent=`CHF ${parseFloat(el.dataset.chf).toFixed(2)}`;
        else if(sel==='EUR') el.textContent=`€${parseFloat(el.dataset.eur).toFixed(2)}`;
        else el.textContent=`$${parseFloat(el.dataset.usd).toFixed(2)}`;
      });
    });
  </script>

</body>
</html>
