  <script src="products.js"></script>

  <script>
    // Load config for footer/social
    function deepMerge(base, over) {
      const r={...base};
      for(const k in over){
        if(over[k]&&typeof over[k]==='object'&&!Array.isArray(over[k])) r[k]=deepMerge(base[k]||{},over[k]);
        else r[k]=over[k];
      }
      return r;
    }
    const cfg = (()=>{
      try {
        const s=JSON.parse(localStorage.getItem('fm_cfg')||'{}');
        return deepMerge(typeof SITE_CONFIG!=='undefined'?SITE_CONFIG:{},s.siteConfig||{});
      } catch { return typeof SITE_CONFIG!=='undefined'?SITE_CONFIG:{}; }
    })();

    // Footer
    if(cfg.footer?.line1) document.getElementById('footer-line1').textContent=cfg.footer.line1;
    if(cfg.footer?.line2) document.getElementById('footer-line2').textContent=cfg.footer.line2;

    // Social
    function setSocial(prefix, platform, url) {
      const el=document.getElementById(`${prefix}-${platform}`);
      if(el&&url){el.href=url;el.style.display='inline-flex';}
    }
    if(cfg.social?.enabled!==false&&(cfg.social?.instagram||cfg.social?.tiktok)){
      const pos=cfg.social?.position||'both';
      if(pos==='header'||pos==='both'){
        document.getElementById('header-social').style.display='flex';
        setSocial('header','instagram',cfg.social.instagram);
        setSocial('header','tiktok',cfg.social.tiktok);
      }
      if(pos==='footer'||pos==='both'){
        document.getElementById('footer-social').style.display='flex';
        setSocial('footer','instagram',cfg.social.instagram);
        setSocial('footer','tiktok',cfg.social.tiktok);
      }
    }

    const GRIDS = {
      ski:      document.getElementById('grid-ski'),
      obstacle: document.getElementById('grid-obstacle'),
      mtb:      document.getElementById('grid-mtb'),
      kit:      document.getElementById('grid-kit'),
    };

    function statusHTML(status) {
      const map = {
        available: ['In Stock','#d4edda','#155724'],
        'sold-out': ['Sold Out','#f8d7da','#721c24'],
        soon: ['Coming Soon','#fff3cd','#856404'],
      };
      const [label,bg,color]=map[status]||['','#eee','#333'];
      return `<span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600;background:${bg};color:${color};margin-bottom:6px">${label}</span>`;
    }

    function buildCard(p) {
      const img=(p.images&&p.images.length>0)?p.images[0]:'COMING SOON.png';
      const priceHTML=p.status==='available'
        ?`<p class="price" data-usd="${p.priceUSD}" data-chf="${p.priceCHF}" data-eur="${p.priceEUR}">$${p.priceUSD.toFixed(2)}</p>`:'';
      return `<div class="product">
        <img src="${img}" alt="${p.name}" loading="lazy">
        <h2>${p.name}</h2>
        ${statusHTML(p.status)}
        ${priceHTML}
        <button><a href="product.html?id=${p.id}">See More</a></button>
      </div>`;
    }

    PRODUCTS.forEach(p=>{
      const grid=GRIDS[p.category];
      if(grid) grid.innerHTML+=buildCard(p);
    });

    Object.entries(GRIDS).forEach(([cat,el])=>{
      if(!el.innerHTML.trim()){
        el.previousElementSibling.style.display='none';
        el.style.display='none';
      }
    });

    document.getElementById('currencySwitch').addEventListener('change',function(){
      const sel=this.value;
      document.querySelectorAll('.price').forEach(el=>{
        if(!el.dataset.usd) return;
        if(sel==='CHF') el.textContent=`CHF ${parseFloat(el.dataset.chf).toFixed(2)}`;
        else if(sel==='EUR') el.textContent=`€${parseFloat(el.dataset.eur).toFixed(2)}`;
        else el.textContent=`$${parseFloat(el.dataset.usd).toFixed(2)}`;
      });
    });
  </script>
</body>
